<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de toma de pedidos para meseros — RestoApp.">
  <title>Pedidos — RestoApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page pedido-page">

  <!-- Barra de navegación -->
  <nav class="navbar" aria-label="Navegación principal">
    <div class="navbar__brand">
      <span aria-hidden="true">🍽️</span>
      <span>Resto<span>App</span></span>
    </div>
    <div class="navbar__actions">
      <a href="admin.html" class="btn btn--ghost">Panel admin</a>
      <button id="logout-btn" class="btn btn--danger">Cerrar sesión</button>
    </div>
  </nav>

  <main class="main">
    <div class="container container--wide">
      <div class="card">

        <header class="card__header">
          <div class="card__icon" aria-hidden="true">🧾</div>
          <div>
            <h1 class="card__title">Tomar pedido</h1>
            <p class="card__subtitle">Selecciona el plato, ingresa la cantidad y procesa el pedido</p>
          </div>
        </header>

        <form id="order-form" class="form" novalidate>
          <div class="form-group">
            <label class="form-label" for="menu-select">Plato</label>
            <select id="menu-select" class="form-select" required aria-label="Selección de plato del menú">
              <option value="">Cargando menú…</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="quantity">Cantidad</label>
              <input
                id="quantity"
                type="number"
                class="form-input"
                placeholder="Ej: 2"
                min="1"
                step="1"
                required
              >
            </div>
            <div class="form-group">
              <label class="form-label" for="unit-price">Precio unitario (USD)</label>
              <input
                id="unit-price"
                type="number"
                class="form-input"
                placeholder="Se autocompleta"
                min="0"
                step="0.01"
                readonly
                aria-readonly="true"
              >
            </div>
          </div>

          <div id="order-message" class="form-message" role="alert" aria-live="polite"></div>

          <button id="process-btn" type="submit" class="btn btn--primary">
            Procesar pedido
          </button>
        </form>

        <!-- Resumen del pedido procesado -->
        <div id="order-summary" class="order-summary" role="region" aria-label="Resumen del pedido" aria-live="polite"></div>

      </div>
    </div>
  </main>

  <script type="module">
    import { loadMenu, getPriceByKey, getNameByKey } from './js/menu.js';
    import { calculateTotals, validateOrderForm, buildOrderSummaryHTML } from './js/pedidos.js';
    import { requireAuth, logout } from './js/auth.js';

    // Proteger página: obliga a estar autenticado
    await requireAuth();

    const menuSelect  = document.getElementById('menu-select');
    const quantityInput = document.getElementById('quantity');
    const unitPriceInput = document.getElementById('unit-price');
    const orderForm   = document.getElementById('order-form');
    const messageEl   = document.getElementById('order-message');
    const summaryEl   = document.getElementById('order-summary');
    const processBtn  = document.getElementById('process-btn');
    const logoutBtn   = document.getElementById('logout-btn');

    // Cargar menú al iniciar la página
    await loadMenu(menuSelect);

    // Event listener para cerrar sesión
    logoutBtn?.addEventListener('click', async () => {
      await logout();
      window.location.href = 'login.html';
    });

    // Autocompletar el precio al seleccionar un plato
    menuSelect.addEventListener('change', () => {
      const selectedKey = menuSelect.value;
      unitPriceInput.value = selectedKey ? getPriceByKey(selectedKey).toFixed(2) : '';
      clearFeedback();
    });

    // Procesar el pedido al enviar el formulario
    orderForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const formData = {
        itemKey:   menuSelect.value,
        quantity:  parseFloat(quantityInput.value),
        unitPrice: parseFloat(unitPriceInput.value),
      };

      const validation = validateOrderForm(formData);
      if (!validation.valid) {
        showMessage(validation.message, 'error');
        return;
      }

      try {
        const totals = calculateTotals(formData.quantity, formData.unitPrice);
        const itemName = getNameByKey(formData.itemKey);
        summaryEl.innerHTML = buildOrderSummaryHTML(itemName, totals);
        clearFeedback();
        orderForm.reset();
        unitPriceInput.value = '';
      } catch (err) {
        showMessage(err.message, 'error');
      }
    });

    function showMessage(message, type) {
      messageEl.textContent = message;
      messageEl.className = `form-message form-message--${type}`;
    }

    function clearFeedback() {
      messageEl.textContent = '';
      messageEl.className = 'form-message';
    }
  </script>

</body>
</html>
