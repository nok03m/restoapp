<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00de;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="12" fill="#0a0a1a" stroke="url(#neonGrad)" stroke-width="2" filter="url(#glow)"/>
  <text x="50" y="42" font-family="monospace" font-size="22" font-weight="bold" fill="#00f0ff" text-anchor="middle" filter="url(#glow)">R</text>
  <text x="50" y="68" font-family="monospace" font-size="11" fill="#ff00de" text-anchor="middle" filter="url(#glow)">APP</text>
  <line x1="20" y1="48" x2="80" y2="48" stroke="#00f0ff" stroke-width="0.5" opacity="0.4"/>
</svg>
