<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de sesión para el sistema de pedidos RestoApp.">
  <title>Iniciar sesión — RestoApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page login-page">

  <main class="main">
    <div class="container">
      <div class="card">

        <header class="card__header">
          <div class="card__icon" aria-hidden="true">🍽️</div>
          <div>
            <h1 class="card__title">RestoApp</h1>
            <p class="card__subtitle">Sistema de pedidos — Acceso al sistema</p>
          </div>
        </header>

        <form id="login-form" class="form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              id="email"
              type="email"
              class="form-input"
              placeholder="Ingresa tu email"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Contraseña</label>
            <input
              id="password"
              type="password"
              class="form-input"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            >
          </div>

          <div id="login-message" class="form-message" role="alert" aria-live="polite"></div>

          <button id="login-btn" type="submit" class="btn btn--primary">
            Ingresar
          </button>
        </form>

        <hr class="divider">

        <p class="text-center text-sm text-muted">
          ¿Eres mesero?
          <a href="index.html">Ir a tomar pedidos →</a>
        </p>

      </div>
    </div>
  </main>

  <script type="module">
    import { login, isAuthenticated } from './js/auth.js';

    // Si ya hay sesión activa, redirigir directamente al panel de admin
    const alreadyLoggedIn = await isAuthenticated();
    if (alreadyLoggedIn) {
      window.location.href = 'admin.html';
    }

    const form       = document.getElementById('login-form');
    const messageEl  = document.getElementById('login-message');
    const loginBtn   = document.getElementById('login-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      loginBtn.disabled = true;
      loginBtn.textContent = 'Verificando…';

      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const result   = await login(email, password);

      if (result.success) {
        showMessage(result.message, 'success');
        loginBtn.textContent = 'Redirigiendo…';
        setTimeout(() => { window.location.href = 'admin.html'; }, 600);
      } else {
        showMessage(result.message, 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Ingresar';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });

    function showMessage(message, type) {
      messageEl.textContent = message;
      messageEl.className = `form-message form-message--${type}`;
    }
  </script>

</body>
</html>
